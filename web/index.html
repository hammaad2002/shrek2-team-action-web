<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shrek 2 Team Action — in your browser</title>
    <style>
      :root {
        --bg: #11160f;
        --panel: #1c2418;
        --ink: #e8ecd9;
        --muted: #a5ad93;
        --accent: #9ccc3c;
        --danger: #e0705a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
      #shell { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
      h1 { font-size: 26px; margin: 0 0 4px; }
      p { color: var(--muted); }
      .panel { background: var(--panel); border-radius: 10px; padding: 18px; margin: 18px 0; }
      button, label.button { display: inline-block; background: var(--accent); color: #11160f; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary { background: transparent; color: var(--muted); border: 1px solid #3a4630; }
      progress { width: 100%; height: 12px; }
      #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: var(--muted); max-height: 180px; overflow: auto; }
      .error { color: var(--danger); }
      #game { position: fixed; inset: 0; background: #000; display: none; }
      #game.on { display: block; }
      #canvas { width: 100%; height: 100%; display: block; outline: none; }
    </style>
  </head>
  <body>
    <div id="shell">
      <h1>Shrek 2 Team Action</h1>
      <p>Play your own copy of the 2004 PC game in this browser. The game files come from your disc image and stay on this device.</p>
      <div class="panel" id="status-panel">
        <div id="status">Checking this browser…</div>
        <progress id="progress" max="1" value="0" hidden></progress>
      </div>
      <div class="panel" id="install-panel" hidden>
        <p>Choose your <strong>Shrek 2 Team Action</strong> disc image (.iso). It is unpacked into this browser's private storage (about 900 MB).</p>
        <label class="button">Choose disc image<input id="iso" type="file" accept=".iso" hidden /></label>
      </div>
      <div class="panel" id="play-panel" hidden>
        <button id="play">Play</button>
        <button id="reinstall" class="secondary">Reinstall from disc image</button>
      </div>
      <div id="log"></div>
    </div>
    <div id="game"><canvas id="canvas" tabindex="0"></canvas></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
